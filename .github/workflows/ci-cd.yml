
name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    name: Lint + Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 .

      - name: Run tests with pytest
        run: pytest -v

  docker-build:
    name: Docker Build + Health Check
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t assignment-tracker:ci .

      - name: Run container and verify /health
        run: |
          docker run -d -p 5000:5000 --name assignment-tracker-ci assignment-tracker:ci

          success=0
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo "Health check passed"
              success=1
              break
            fi
            echo "Waiting for container..."
            sleep 2
          done

          docker logs assignment-tracker-ci

          if [ "$success" -ne 1 ]; then
            echo "Health check failed"
            docker stop assignment-tracker-ci || true
            exit 1
          fi

          docker stop assignment-tracker-ci

  deploy:
    name: Deploy (main only)
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check deployment secrets
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RENDER_LIVE_URL: ${{ secrets.RENDER_LIVE_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Missing GitHub Actions secret: RENDER_DEPLOY_HOOK"
            exit 1
          fi

          if [ -z "$RENDER_LIVE_URL" ]; then
            echo "Missing GitHub Actions secret: RENDER_LIVE_URL"
            exit 1
          fi

      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          case "$RENDER_DEPLOY_HOOK" in
            *\?*) SEPARATOR="&" ;;
            *) SEPARATOR="?" ;;
          esac

          curl --fail --show-error --silent \
            "${RENDER_DEPLOY_HOOK}${SEPARATOR}ref=${GITHUB_SHA}"

      - name: Wait for deployment
        run: sleep 60

      - name: Verify live health endpoint
        env:
          RENDER_LIVE_URL: ${{ secrets.RENDER_LIVE_URL }}
        run: |
          curl --fail --show-error --silent \
            "${RENDER_LIVE_URL%/}/health"

      - name: Verify live homepage
        env:
          RENDER_LIVE_URL: ${{ secrets.RENDER_LIVE_URL }}
        run: |
          curl --fail --show-error --silent \
            "${RENDER_LIVE_URL%/}/" \
            -o homepage.html

          if [ ! -s homepage.html ]; then
            echo "Homepage returned an empty response"
            exit 1
          fi

          echo "Homepage returned content successfully"

      - name: Verify deployed commit ID
        env:
          RENDER_LIVE_URL: ${{ secrets.RENDER_LIVE_URL }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"

          echo "Expecting commit $SHORT_SHA in the live footer"

          curl --fail --show-error --silent \
            "${RENDER_LIVE_URL%/}/" \
            -o homepage.html

          if grep -q "$SHORT_SHA" homepage.html; then
            echo "Commit ID verified on live site."
          else
            echo "Live site does not show expected commit $SHORT_SHA"
            exit 1
          fi